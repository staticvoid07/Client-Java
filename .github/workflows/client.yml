name: build client

# Builds rs2client.jar and emits the manifest the launcher reads. This is the
# link that turns "pushed to the repo" into "players get it on next launch" -
# without it the launcher just re-verifies whatever stale jar the website serves.
#
# Channel is chosen by branch:
#   254                             -> live
#   anything else (e.g. fix/*)      -> staging
#
# Publishing is deliberately left as a separate step (see the end of this file):
# uploading straight to the live website on every push would ship untested
# clients to players.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Override the channel (live or staging)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build client and launcher
        run: ./gradlew jar :launcher:jar --no-daemon

      - name: Work out the channel and version
        id: meta
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            if [ "${{ github.ref_name }}" = "254" ]; then CHANNEL=live; else CHANNEL=staging; fi
          fi
          VERSION="$(git rev-parse --short HEAD)"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL version=$VERSION"

      - name: Generate manifest
        run: |
          set -eu
          CHANNEL='${{ steps.meta.outputs.channel }}'
          VERSION='${{ steps.meta.outputs.version }}'
          JAR=build/libs/rs2client.jar
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)

          if [ "$CHANNEL" = "live" ]; then
            JAR_URL="https://vortexidle.com/client/rs2client.jar"
          else
            JAR_URL="https://vortexidle.com/client/staging/rs2client.jar"
          fi

          mkdir -p build/dist
          cp "$JAR" build/dist/rs2client.jar
          cp launcher/build/libs/vortexscape-launcher.jar build/dist/
          cat > build/dist/manifest.json <<EOF
          {
            "channel": "$CHANNEL",
            "version": "$VERSION",
            "jar": "$JAR_URL",
            "sha256": "$SHA"
          }
          EOF
          cat build/dist/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.version }}
          path: build/dist/

# ---------------------------------------------------------------------------
# Publishing (not wired up yet - needs a deploy key or token in repo secrets).
#
# Once you decide how the website gets updated, add a step here that copies
# build/dist/{rs2client.jar,manifest.json} to:
#
#   live     ->  /root/VortexScape-website/client/
#   staging  ->  /root/VortexScape-website/client/staging/
#
# Write the jar FIRST and the manifest SECOND. The manifest is what tells a
# launcher to download, so publishing it before the jar it points at gives every
# client a window where it fetches a 404 or, worse, the previous jar under the
# new hash - which fails verification and falls back to the cached copy.
# ---------------------------------------------------------------------------
