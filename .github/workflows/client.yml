name: build client

# Turns "pushed to this repo" into "players get it on next launch".
#
# GitHub holds source, not a runnable jar, so something has to run gradle
# between a push and there being anything to download. That is this workflow.
#
# Channel is chosen by branch:
#   254                        -> live
#   anything else (fix/*, ...) -> staging
#
# Each channel publishes to a release under a FIXED tag ("live" / "staging")
# that gets overwritten, so the launcher can point at a stable URL:
#
#   https://github.com/<owner>/<repo>/releases/download/live/manifest.json
#
# Uses the built-in GITHUB_TOKEN - no deploy key or website credentials needed.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Override the channel (live or staging)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build client and launcher
        run: ./gradlew jar :launcher:jar --no-daemon

      - name: Work out the channel and version
        id: meta
        run: |
          set -eu
          CHANNEL="${{ github.event.inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            if [ "${{ github.ref_name }}" = "254" ]; then CHANNEL=live; else CHANNEL=staging; fi
          fi
          VERSION="$(git rev-parse --short HEAD)"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL version=$VERSION"

      - name: Stage artifacts and generate the manifest
        run: |
          set -eu
          CHANNEL='${{ steps.meta.outputs.channel }}'
          VERSION='${{ steps.meta.outputs.version }}'
          JAR=build/libs/rs2client.jar
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          JAR_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$CHANNEL/rs2client.jar"

          mkdir -p build/dist
          cp "$JAR" build/dist/rs2client.jar
          cp launcher/build/libs/vortexscape-launcher.jar build/dist/
          cat > build/dist/manifest.json <<EOF
          {
            "channel": "$CHANNEL",
            "version": "$VERSION",
            "jar": "$JAR_URL",
            "sha256": "$SHA"
          }
          EOF
          cat build/dist/manifest.json

      - name: Publish to the channel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          CHANNEL='${{ steps.meta.outputs.channel }}'
          VERSION='${{ steps.meta.outputs.version }}'

          PRERELEASE=""
          if [ "$CHANNEL" != "live" ]; then PRERELEASE="--prerelease"; fi

          # Fixed per-channel tag, updated in place, so the launcher URL never moves.
          if ! gh release view "$CHANNEL" >/dev/null 2>&1; then
            gh release create "$CHANNEL" \
              --title "VortexScape client ($CHANNEL)" \
              --notes "Rolling $CHANNEL client build. Updated automatically." \
              --target "${{ github.sha }}" \
              $PRERELEASE
          fi

          # Order matters: the jar goes up FIRST, the manifest LAST. The manifest is
          # what tells a launcher to download, so publishing it before the jar it
          # points at leaves a window where every client fetches a 404 or the
          # previous jar under the new hash - which fails verification.
          gh release upload "$CHANNEL" build/dist/rs2client.jar --clobber
          gh release upload "$CHANNEL" build/dist/vortexscape-launcher.jar --clobber
          gh release upload "$CHANNEL" build/dist/manifest.json --clobber

          gh release edit "$CHANNEL" \
            --notes "Rolling $CHANNEL client build - $VERSION (${{ github.sha }})"

      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.version }}
          path: build/dist/
